server:
  port: 8080

# ===== 管理端口（actuator/prometheus） =====
# 独立端口且只绑 127.0.0.1：只供本机 Prometheus 抓取/排障，
# 不经 nginx、不走安全组，外部网络不可达（纵深防御）。
# 生产可用环境变量 MANAGEMENT_PORT 改端口。
management:
  server:
    port: ${MANAGEMENT_PORT:18080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: simple-agent

# ===== 服务间鉴权 =====
# backend 调用 agent 时必须携带请求头 X-Agent-Token，值与此处一致
# 生产环境通过环境变量 AGENT_INTERNAL_TOKEN 注入强随机值（systemd Environment）；
# 下方默认值仅供本地开发，未配置时除 /health 外所有接口拒绝访问
agent:
  internal-token: ${AGENT_INTERNAL_TOKEN:dev-internal-token}
  # ===== Agent 循环护栏 =====
  loop:
    # 单次对话中工具调用（含"模型→工具→模型"完整往返）的最大轮次；
    # 超限后强制收敛为一条提示（库默认 100 太高，易被死循环 prompt 烧 token）
    max-tool-round-trips: 15
  # ===== 高危工具人工确认（human-in-the-loop） =====
  approval:
    # 前端审批弹窗等待时长（秒）；超时高危操作自动拒绝。必须小于 SSE 总超时 5 分钟
    timeout-seconds: 60
  # ===== 联网工具（内置技能 web / http-api） =====
  tools:
    web:
      enabled: true                    # false 时不注册搜索/抓取工具 Bean
      # 免 Key 搜索 Provider 顺序：国内生产优先 cn.bing.com，失败回退 DuckDuckGo
      search-providers: bing,duckduckgo
      connect-timeout: 5s
      read-timeout: 10s
      max-body-bytes: 2097152          # 响应体下载上限 2MB，超出截断
      max-text-chars: 8000             # 返回给模型的文本上限（字符）
      search-default-results: 5
      search-max-results: 10
    http:
      enabled: true                    # false 时不注册通用 HTTP 工具 Bean
  # ===== MCP（Model Context Protocol）外部工具生态 =====
  # 默认空列表：功能休眠。配置后每个 server 生成内置技能 mcp:{name}，用户挂载后其工具动态可用。
  mcp:
    servers: []
    # Streamable HTTP 示例：
    # - name: everything
    #   transport: http                 # http = Streamable HTTP；stdio = 本地子进程
    #   url: http://127.0.0.1:3001/mcp
    #   approval: confirm               # confirm（默认，每次人工确认）| auto（仅可信内网 server）
    #   description: MCP everything 示例
    # stdio 示例（服务器需装有 node/npx 等运行时）：
    # - name: fs
    #   transport: stdio
    #   command: ["npx", "-y", "@modelcontextprotocol/server-everything"]
    #   environment: {}
    #   approval: confirm

# ===== LangChain4j 配置 =====
# 支持 OpenAI、Azure OpenAI、以及任意 OpenAI 兼容接口（如 DeepSeek、通义千问、Kimi、Ollama 等）
# 只需修改 base-url / api-key / model-name 三项即可切换
langchain4j:
  open-ai:
    chat-model:
      # API Key：必须由环境变量 OPENAI_API_KEY 注入，代码/配置中不保留任何明文默认值
      # 生产：systemd unit 的 Environment=OPENAI_API_KEY=... 注入
      # 本地：Windows PowerShell $env:OPENAI_API_KEY="sk-xxx"，或 IDE 运行配置的 Environment Variables
      # 未配置时启动即失败（AgentConfig fail-fast），不会拖到首次对话才报错
      api-key: ${OPENAI_API_KEY:}
      # Base URL：默认官方 OpenAI，替换为兼容接口时改这里（非敏感，可保留默认）
      # DeepSeek: https://api.deepseek.com/v1
      # 通义千问兼容: https://dashscope.aliyuncs.com/compatible-mode/v1
      # Ollama: http://localhost:11434/v1
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      # 模型名
      model-name: ${OPENAI_MODEL:deepseek-v4-flash}
      # 备用模型：主模型限流/故障时降级（与主模型共用 api-key/base-url，仅换模型名）
      fallback-model-name: ${OPENAI_FALLBACK_MODEL:deepseek-chat}
      # 生成参数
      temperature: 0.7
      top-p: 0.9
      timeout: 60s
      # 原始 HTTP 请求/响应日志（已用 ReActLoggerListener 打印友好格式，这里关掉避免重复刷屏）
      log-requests: false
      log-responses: false

# ===== RAG 检索增强配置 =====
# 使用本地进程内 Embedding 模型（bge-small-zh-v1.5 量化版，ONNX），无需外部 API Key
rag:
  enabled: true              # 置 false 可完全关闭 RAG（对话不受影响）
  # 向量库快照文件（相对服务 WorkingDirectory；启动自动加载，写入后防抖异步落盘，重启不丢索引）
  store-file: data/rag-embeddings.json
  chunk-size: 500            # 文档切块：每段最大字符数（中文按字符计）
  chunk-overlap: 50          # 相邻块重叠字符数，避免语义被切断
  search:
    max-results: 4           # 每次检索最多召回片段数
    min-score: 0.5           # 相似度下限（0~1），低于此值不注入上下文

# ===== 日志配置 =====
logging:
  level:
    # 我们自己的代码：INFO 可见（ReAct 日志、工具调用日志）
    com.example.agent: INFO
    # LangChain4j 框架日志：INFO（看不到内部细节，只看我们 listener 打的）
    dev.langchain4j: WARN
    # Spring 框架：WARN，减少启动噪音
    org.springframework: WARN
  pattern:
    # 日志格式：[traceId] 串联 frontend→backend→agent→LLM/工具/RAG 全链路（无 trace 时显示 -）
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
