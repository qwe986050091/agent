server:
  port: 8080
  # 优雅停机：SIGTERM 后先拒绝新请求、等待在途请求（含 SSE 流）完成再退出，
  # 配合蓝绿发布（agent-blue / agent-green 双槽位）做到发布零中断
  shutdown: graceful

# ===== 管理端口（actuator/prometheus） =====
# 独立端口且只绑 127.0.0.1：只供本机 Prometheus 抓取/排障，
# 不经 nginx、不走安全组，外部网络不可达（纵深防御）。
# 生产可用环境变量 MANAGEMENT_PORT 改端口。
management:
  server:
    port: ${MANAGEMENT_PORT:18080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: simple-agent
  # 优雅停机最长等待在途请求的时间（需小于 systemd TimeoutStopSec=45s）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 知识库文档上传（P1-9.2：PDF/Word/Excel 等二进制文档，backend 转发原始字节）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

# ===== 服务间鉴权 =====
# backend 调用 agent 时必须携带请求头 X-Agent-Token，值与此处一致
# 生产环境通过环境变量 AGENT_INTERNAL_TOKEN 注入强随机值（systemd Environment）；
# 下方默认值仅供本地开发，未配置时除 /health 外所有接口拒绝访问
agent:
  internal-token: ${AGENT_INTERNAL_TOKEN:dev-internal-token}
  # ===== Agent 循环护栏 =====
  loop:
    # 单次对话中工具调用（含"模型→工具→模型"完整往返）的最大轮次；
    # 超限后强制收敛为一条提示（库默认 100 太高，易被死循环 prompt 烧 token）
    max-tool-round-trips: 15
  # ===== 上下文工程（P1-D）：四段 token 预算 + 超限裁剪 =====
  # 四段：system（人设+技能+安全边界）/ summary（历史摘要）/ retrieval（知识库片段）/
  #       history（最近对话，含本轮用户消息）。system 与当前消息受保护，不裁剪。
  # A/B：改 strategy 后重跑 eval（agent.context.* 可用环境变量/启动参数覆盖），
  #      对比通过率与 avgTokens，即为「裁剪策略 A vs B」的量化验证。
  context:
    enabled: true                  # false = 不裁剪（仅观测，等同回滚）
    strategy: balanced             # balanced（先裁历史，检索最保）| history-priority（先裁摘要，最近原文最保）
    total-budget-tokens: 10000     # 四段合计输入预算（不含模型输出）
    system-max-tokens: 2500        # system 段预算（受保护，超限只标记）
    summary-max-tokens: 1200       # 摘要段预算（超出硬裁剪）
    history-max-tokens: 4500       # 历史段预算（含本轮消息；超出从最旧消息丢弃）
    retrieval-max-tokens: 2500     # 检索片段预算（含引用规则固定开销）
    min-history-messages: 2        # 历史段至少保留的最近消息条数
  # ===== 工具结果治理（P0）：ReAct 循环内的工具结果预算 =====
  # 四段上下文预算（agent.context.*）不覆盖工具结果，一次超长网页/MCP 返回即可挤爆上下文。
  # 单条超限保留头尾并截断；累计超限从最旧工具结果开始清理，始终保留最新一条。
  # 落盘仅用于审计/排障（agent 没有文件读取工具，模型看不到原文）。
  tool-result:
    enabled: true
    max-chars-per-result: 8000   # 与内置工具自限（网页 8000 / 代码输出 8000）对齐
    max-total-chars-per-turn: 24000
    head-chars: 3000
    tail-chars: 1000
    spill-dir: ${AGENT_TOOL_RESULT_SPILL_DIR:}   # 空 = 不落盘
  # ===== 子代理（Agent-as-Tool）：技能声明 type=agent 时，主 Agent 以委派工具方式调用 =====
  subagent:
    enabled: true                    # 关闭时 type=agent 的技能退化为普通技能（工具直挂主 Agent）
    max-tool-round-trips: 8          # 单个子代理内部工具循环的最大轮次（防子代理死循环）
    max-delegations-per-turn: 4      # 单回合所有子代理的委派次数上限（全局预算，防多子代理 fan-out 成本失控）
    max-task-chars: 4000             # 单次委派任务指令字符上限（防超长任务灌爆子代理上下文）
    rag-enabled: true                # 子代理是否接入 RAG（按用户检索知识库；RAG 关闭/降级时自动退化为纯工具模式）
  # ===== 意图路由（Router）：把本轮交给命中的单个专家，不命中则走主 Agent（Supervisor） =====
  router:
    enabled: false                   # 默认关闭；开启后每轮多一次轻量判定调用（判定模型复用主模型）
  # ===== fan-out（并行扇出）：一轮内并发派发多个子代理并合并结果 =====
  fanout:
    enabled: true                    # 开启：Supervisor 模式挂上 delegate_parallel 工具
    max-parallel: 3                  # 并发执行的子代理上限（有界线程池大小）
    per-task-timeout-seconds: 120    # 单个子任务超时（必须大于 agent.approval.timeout-seconds：子代理可能等人工确认）
  # ===== Planner（任务分解）：把有依赖的多步任务拆成有序步骤并串行执行 =====
  planner:
    enabled: true                    # 开启且挂载 ≥2 个子代理时挂上 delegate_plan 工具（模型按需调用）
    max-steps: 4                     # 单个计划最多步骤数（同时计入回合委派预算）
  # ===== 高危工具人工确认（human-in-the-loop） =====
  approval:
    # 前端审批弹窗等待时长（秒）；超时高危操作自动拒绝。必须小于 SSE 总超时 5 分钟
    timeout-seconds: 60
    # 装配期拒绝：命中的技能整包不下发（工具与系统提示都看不到），模型无从调用
    denied-skills: []
    # 参数级规则（自上而下，首个命中生效；args-regex 为正则全匹配，留空=任意参数）
    # action: allow（免确认）| deny（直接拒绝）| confirm（强制人工确认，覆盖 AUTO 与会话级授权）
    rules:
      # - tool: fetchWebPage
      #   args-regex: "https://(docs|api)\\.example\\.com/.*"
      #   action: allow
      # - tool: sendHttpRequest
      #   args-regex: ".*://(127\\.0\\.0\\.1|localhost).*"
      #   action: deny
  # ===== 可编程扩展点（P1）：Hook 事件订阅 =====
  # 实现 @Component AgentHook 即可订阅；异步有界分发，单个 Hook 异常/超时不阻塞对话。
  # 与 trace 事件的区别：Hook 只在进程内消费，不改变 agent→backend 协议。
  hooks:
    enabled: true
    max-parallel: 2              # 分发线程数（有界队列 256，满则丢弃并计数）
    timeout-ms: 500              # 单个 Hook 耗时告警阈值（不中断执行）
  # ===== 多模态（P1-8）：deepseek-flash 原生支持图片输入，此处仅为防御性校验闸门 =====
  multimodal:
    max-images: 6              # 单回合图片数上限（backend 已收紧到 3，agent 侧兜底）
    max-image-bytes: 20971520  # 单图解码后 ≤20MiB（DeepSeek 内联上限 32MiB，留余量）
  # ===== 内容安全（P4-17）：prompt 注入检测 / 不可信内容边界化 / 出站 DLP =====
  safety:
    enabled: true
    mode: monitor                 # monitor（只记录）| warn（灰区注警戒语，不拒绝）| block（≥阈值拒绝）
    rule:
      block-threshold: 8          # ≥ 该分且 mode=block：拒绝（400 SAFETY_BLOCKED）
      gray-threshold: 4           # ≥ 该分：灰区（触发 LLM 分类 + 警戒语）
    llm-classifier:
      enabled: true
      model: ""                   # 判定模型，空 = 复用主模型
      timeout-seconds: 5          # 超时 fail-open 放行（可用性优先）
      cache-size: 1000            # 输入 hash 判定结果内存缓存条数
    untrusted-wrap: true          # RAG/工具结果包裹边界 + System Prompt 安全边界声明
    dlp:
      enabled: true
      block-outbound-secrets: true  # 出站请求命中真实凭据（env 实际值）时直接拒绝
    output-scan: monitor          # off | monitor（v1 只记录，不拦截已发出的流）
  # ===== 联网工具（内置技能 web / http-api） =====
  tools:
    web:
      enabled: true                    # false 时不注册搜索/抓取工具 Bean
      # 免 Key 搜索 Provider 顺序：国内生产优先 cn.bing.com，失败回退 DuckDuckGo
      search-providers: bing,duckduckgo
      connect-timeout: 5s
      read-timeout: 10s
      max-body-bytes: 2097152          # 响应体下载上限 2MB，超出截断
      max-text-chars: 8000             # 返回给模型的文本上限（字符）
      search-default-results: 5
      search-max-results: 10
    http:
      enabled: true                    # false 时不注册通用 HTTP 工具 Bean
    # ===== 代码执行沙箱（内置技能 code-runner，P1-6.3） =====
    code:
      enabled: ${AGENT_TOOLS_CODE_ENABLED:false}   # 默认休眠；生产经 systemd Environment=true 开启
      # auto=Linux 强制 systemd-run 沙箱（非 Linux 回退无隔离 direct 仅供本地开发）；
      # systemd=仅沙箱（非 Linux 启动失败）；direct=本机直跑 Python，无任何隔离，禁止生产使用
      runtime: auto
      timeout-seconds: 30              # 单次执行上限：systemd RuntimeMaxSec 杀整个 cgroup，Java 再 +10s 兜底
      memory-max: 256M                 # cgroup 内存上限，超出内核 OOM 终止
      cpu-quota: 100                   # CPU 配额百分比（100 = 1 核）
      tasks-max: 64                    # 进程/线程数上限（防 fork 炸弹）
      max-concurrency: 1               # 同时执行的沙箱任务数（信号量限流，满载直接友好提示）
      max-output-chars: 8000           # stdout/stderr 合并输出上限（字符）
      # 临时脚本目录；非 root 的 sudo wrapper 模式须与 wrapper 内白名单目录一致
      work-dir: ${CODE_SANDBOX_DIR:data/sandbox}
      # 非 root 运行时的 sudo wrapper（安全参数在 wrapper 内固定，sudoers 仅放行该脚本）
      sudo-wrapper: ${CODE_SANDBOX_WRAPPER:/opt/agent-sandbox/run-sandbox}
      python-command: ${CODE_PYTHON:}  # direct 模式解释器；留空=Linux /usr/bin/python3、其他平台 python
  # ===== MCP（Model Context Protocol）外部工具生态 =====
  # 每个 server 生成内置技能 mcp:{name}，backend 启动时同步进 skill 表，用户挂载后其工具动态可用。
  mcp:
    servers:
      # 自研 Go MCP Server（P0-A / S6）：源码 d:\code\mcp-server-go，工具 web_search / web_fetch / kb_search / code_run / calc。
      # 本段走 Streamable HTTP，连本机常驻 systemd 服务 mcp-server-go（127.0.0.1:3001，unit 内含 AGENT_INTERNAL_TOKEN）。
      - name: goweb
        transport: http
        url: http://127.0.0.1:3001/mcp
        approval: auto                 # 先 auto 打通链路，验收后再按需改 confirm
        injectUserId: true             # kb_search 需要按用户隔离，注入隐藏参数 user_id
        description: Go MCP Server（Streamable HTTP）：网页搜索/抓取、知识库检索、代码沙箱、计算
      # 同一二进制的 stdio 链路：由 agent 直接拉起子进程，继承 agent 进程环境（含内部口令），无需额外配置。
      # 与 goweb 工具完全一致，双配是为了同时验证两条 MCP 传输链路（S6 已实测 stdio 可用）。
      - name: gostdio
        transport: stdio
        command: ["/opt/agent/mcp-server-go", "--transport", "stdio"]
        approval: auto                 # 与 goweb 保持一致，避免同一套工具出现两种审批行为
        injectUserId: true
        description: Go MCP Server（stdio）：与 goweb 同一套工具
      # 安全提示：两个 server 目前都是 auto（受信的本机回环服务，工具有 SSRF 防护、代码沙箱无网络）。
      # 若将来给该机器装上 Docker（code_run 具备真实沙箱执行能力），应把对应 server 改成
      # approval: confirm —— MCP 的审批粒度是「按 server」而非按工具，只读工具可用「记住本次授权」免二次确认。
    # 其它 server 示例（列表为空即功能休眠）：
    # - name: everything
    #   transport: http                 # http = Streamable HTTP；stdio = 本地子进程
    #   url: http://127.0.0.1:3001/mcp
    #   approval: confirm               # confirm（默认，每次人工确认）| auto（仅可信内网 server）
    #   description: MCP everything 示例
    # stdio 示例（服务器需装有 node/npx 等运行时）：
    # - name: fs
    #   transport: stdio
    #   command: ["npx", "-y", "@modelcontextprotocol/server-everything"]
    #   environment: {}
    #   approval: confirm

# ===== LangChain4j 配置 =====
# 支持 OpenAI、Azure OpenAI、以及任意 OpenAI 兼容接口（如 DeepSeek、通义千问、Kimi、Ollama 等）
# 只需修改 base-url / api-key / model-name 三项即可切换
langchain4j:
  open-ai:
    chat-model:
      # API Key：必须由环境变量 OPENAI_API_KEY 注入，代码/配置中不保留任何明文默认值
      # 生产：systemd unit 的 Environment=OPENAI_API_KEY=... 注入
      # 本地：Windows PowerShell $env:OPENAI_API_KEY="sk-xxx"，或 IDE 运行配置的 Environment Variables
      # 未配置时启动即失败（AgentConfig fail-fast），不会拖到首次对话才报错
      api-key: ${OPENAI_API_KEY:}
      # Base URL：默认官方 OpenAI，替换为兼容接口时改这里（非敏感，可保留默认）
      # DeepSeek: https://api.deepseek.com/v1
      # 通义千问兼容: https://dashscope.aliyuncs.com/compatible-mode/v1
      # Ollama: http://localhost:11434/v1
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      # 模型名
      model-name: ${OPENAI_MODEL:deepseek-v4-flash}
      # 备用模型：主模型限流/故障时降级（与主模型共用 api-key/base-url，仅换模型名）
      fallback-model-name: ${OPENAI_FALLBACK_MODEL:deepseek-chat}
      # 生成参数
      temperature: 0.7
      top-p: 0.9
      timeout: 60s
      # 原始 HTTP 请求/响应日志（已用 ReActLoggerListener 打印友好格式，这里关掉避免重复刷屏）
      log-requests: false
      log-responses: false

# ===== RAG 检索增强配置 =====
# 使用本地进程内 Embedding 模型（bge-small-zh-v1.5 量化版，ONNX），无需外部 API Key
rag:
  enabled: true              # 置 false 可完全关闭 RAG（对话不受影响）
  # 向量存储模式：memory=进程内 InMemory + JSON 快照（本地默认）；
  #              pgvector=PostgreSQL+pgvector 外置（生产，内存有界/多实例共享，P1-9.1）
  store: ${RAG_STORE:memory}
  # memory 模式的向量快照文件（相对服务 WorkingDirectory；启动加载、写入后防抖异步落盘）
  store-file: data/rag-embeddings.json
  # ===== pgvector 模式连接配置（仅 store=pgvector 时生效；生产经 systemd 环境变量注入） =====
  pgvector:
    host: ${RAG_PG_HOST:127.0.0.1}
    port: ${RAG_PG_PORT:5432}
    database: ${RAG_PG_DATABASE:agent_rag}
    table: rag_embeddings
    user: ${RAG_PG_USER:agent_rag}
    password: ${RAG_PG_PASSWORD:}   # 缺失时启动 fail-fast（与 API key/DB 密码同约定）
    dimension: 512                  # bge-small-zh-v1.5 向量维度，换模型必须同步改
    # 首次 pgvector 启动时，把旧 JSON 快照一次性迁入 PG（PG 为空才执行，成功后快照归档）
    migrate-snapshot: true
  chunk-size: 500            # 文档切块：每段最大字符数（中文按字符计）
  chunk-overlap: 50          # 相邻块重叠字符数，避免语义被切断
  # ===== 二进制文档解析（Tika，P1-9.2） =====
  parse:
    max-text-chars: 500000   # 抽出正文上限 50 万字，超出判定失败（防解析炸弹）
    timeout-seconds: 60      # 单文档解析墙钟超时，超时中断
    threads: 2               # 解析线程池大小（有界队列 8，满载 503）
  search:
    max-results: 4           # 最终注入上下文的片段数（融合/精排之后）
    min-score: 0.5           # 纯向量模式相似度下限（0~1）
    candidate-min-score: 0.3 # 混合/精排模式向量粗召下限（放宽以扩大候选，再交 RRF/Rerank 精选）
    vector-top-k: 10         # 向量粗召条数
    keyword-top-k: 10        # 关键词粗召条数（hybrid=true 时生效）
    hybrid: true             # 双路召回（向量+关键词）；关键词实现不可用时自动退化为纯向量
  # ===== 关键词检索实现（P1-E）：pg=pg_trgm（默认）| es=Elasticsearch =====
  # 两者共用同一套切词与片段 id，切 store 即可做召回/延迟对比实验
  keyword:
    store: ${RAG_KEYWORD_STORE:pg}
    es:
      url: ${RAG_ES_URL:http://127.0.0.1:9200}    # 生产：JD 备机 ES，经 SSH 隧道映射到本机
      index: ${RAG_ES_INDEX:agent-rag}
      timeout-ms: 1500
  # ===== Rerank 精排（P1-9.3）：默认休眠，跑 reranker-setup.sh 下模型并置 enabled=true =====
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    model-dir: ${RAG_RERANK_DIR:/opt/agent-data/models/bge-reranker-base}
    model-file: model_quantized.onnx
    tokenizer-file: tokenizer.json

# ===== Agent 评测（P0-B）：默认关闭 =====
# 只有显式开启才会跑评测 CLI（普通 web 运行绝不触发）：
#   java -jar simple-agent.jar --spring.profiles.active=eval
# 完整可调项见 eval/EvalProperties 与 application-eval.yml
eval:
  enabled: false                # 总开关（eval profile 会置 true）
  dataset: classpath:eval/dataset/agent-eval-v1.json
  mode: in-process              # in-process | http（对已部署 agent 打 HTTP）
  output-dir: target/eval
  judge-enabled: false          # LLM-as-judge，默认关（CI 离线档恒关）
  repetitions: 1
  # 上报 backend 落库 + admin 看板（留空则只出本地报告）
  persist-url: ""
  persist-token: ${EVAL_INGEST_TOKEN:dev-internal-token}

# ===== 日志配置 =====
logging:
  level:
    # 我们自己的代码：INFO 可见（ReAct 日志、工具调用日志）
    com.example.agent: INFO
    # LangChain4j 框架日志：INFO（看不到内部细节，只看我们 listener 打的）
    dev.langchain4j: WARN
    # Spring 框架：WARN，减少启动噪音
    org.springframework: WARN
  pattern:
    # 日志格式：[traceId] 串联 frontend→backend→agent→LLM/工具/RAG 全链路（无 trace 时显示 -）
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
