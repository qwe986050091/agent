server:
  port: 8080

# ===== 管理端口（actuator/prometheus） =====
# 独立端口且只绑 127.0.0.1：只供本机 Prometheus 抓取/排障，
# 不经 nginx、不走安全组，外部网络不可达（纵深防御）。
# 生产可用环境变量 MANAGEMENT_PORT 改端口。
management:
  server:
    port: ${MANAGEMENT_PORT:18080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: simple-agent
  # 知识库文档上传（P1-9.2：PDF/Word/Excel 等二进制文档，backend 转发原始字节）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

# ===== 服务间鉴权 =====
# backend 调用 agent 时必须携带请求头 X-Agent-Token，值与此处一致
# 生产环境通过环境变量 AGENT_INTERNAL_TOKEN 注入强随机值（systemd Environment）；
# 下方默认值仅供本地开发，未配置时除 /health 外所有接口拒绝访问
agent:
  internal-token: ${AGENT_INTERNAL_TOKEN:dev-internal-token}
  # ===== Agent 循环护栏 =====
  loop:
    # 单次对话中工具调用（含"模型→工具→模型"完整往返）的最大轮次；
    # 超限后强制收敛为一条提示（库默认 100 太高，易被死循环 prompt 烧 token）
    max-tool-round-trips: 15
  # ===== 高危工具人工确认（human-in-the-loop） =====
  approval:
    # 前端审批弹窗等待时长（秒）；超时高危操作自动拒绝。必须小于 SSE 总超时 5 分钟
    timeout-seconds: 60
  # ===== 多模态（P1-8）：deepseek-flash 原生支持图片输入，此处仅为防御性校验闸门 =====
  multimodal:
    max-images: 6              # 单回合图片数上限（backend 已收紧到 3，agent 侧兜底）
    max-image-bytes: 20971520  # 单图解码后 ≤20MiB（DeepSeek 内联上限 32MiB，留余量）
  # ===== 联网工具（内置技能 web / http-api） =====
  tools:
    web:
      enabled: true                    # false 时不注册搜索/抓取工具 Bean
      # 免 Key 搜索 Provider 顺序：国内生产优先 cn.bing.com，失败回退 DuckDuckGo
      search-providers: bing,duckduckgo
      connect-timeout: 5s
      read-timeout: 10s
      max-body-bytes: 2097152          # 响应体下载上限 2MB，超出截断
      max-text-chars: 8000             # 返回给模型的文本上限（字符）
      search-default-results: 5
      search-max-results: 10
    http:
      enabled: true                    # false 时不注册通用 HTTP 工具 Bean
    # ===== 代码执行沙箱（内置技能 code-runner，P1-6.3） =====
    code:
      enabled: ${AGENT_TOOLS_CODE_ENABLED:false}   # 默认休眠；生产经 systemd Environment=true 开启
      # auto=Linux 强制 systemd-run 沙箱（非 Linux 回退无隔离 direct 仅供本地开发）；
      # systemd=仅沙箱（非 Linux 启动失败）；direct=本机直跑 Python，无任何隔离，禁止生产使用
      runtime: auto
      timeout-seconds: 30              # 单次执行上限：systemd RuntimeMaxSec 杀整个 cgroup，Java 再 +10s 兜底
      memory-max: 256M                 # cgroup 内存上限，超出内核 OOM 终止
      cpu-quota: 100                   # CPU 配额百分比（100 = 1 核）
      tasks-max: 64                    # 进程/线程数上限（防 fork 炸弹）
      max-concurrency: 1               # 同时执行的沙箱任务数（信号量限流，满载直接友好提示）
      max-output-chars: 8000           # stdout/stderr 合并输出上限（字符）
      # 临时脚本目录；非 root 的 sudo wrapper 模式须与 wrapper 内白名单目录一致
      work-dir: ${CODE_SANDBOX_DIR:data/sandbox}
      # 非 root 运行时的 sudo wrapper（安全参数在 wrapper 内固定，sudoers 仅放行该脚本）
      sudo-wrapper: ${CODE_SANDBOX_WRAPPER:/opt/agent-sandbox/run-sandbox}
      python-command: ${CODE_PYTHON:}  # direct 模式解释器；留空=Linux /usr/bin/python3、其他平台 python
  # ===== MCP（Model Context Protocol）外部工具生态 =====
  # 默认空列表：功能休眠。配置后每个 server 生成内置技能 mcp:{name}，用户挂载后其工具动态可用。
  mcp:
    servers: []
    # Streamable HTTP 示例：
    # - name: everything
    #   transport: http                 # http = Streamable HTTP；stdio = 本地子进程
    #   url: http://127.0.0.1:3001/mcp
    #   approval: confirm               # confirm（默认，每次人工确认）| auto（仅可信内网 server）
    #   description: MCP everything 示例
    # stdio 示例（服务器需装有 node/npx 等运行时）：
    # - name: fs
    #   transport: stdio
    #   command: ["npx", "-y", "@modelcontextprotocol/server-everything"]
    #   environment: {}
    #   approval: confirm

# ===== LangChain4j 配置 =====
# 支持 OpenAI、Azure OpenAI、以及任意 OpenAI 兼容接口（如 DeepSeek、通义千问、Kimi、Ollama 等）
# 只需修改 base-url / api-key / model-name 三项即可切换
langchain4j:
  open-ai:
    chat-model:
      # API Key：必须由环境变量 OPENAI_API_KEY 注入，代码/配置中不保留任何明文默认值
      # 生产：systemd unit 的 Environment=OPENAI_API_KEY=... 注入
      # 本地：Windows PowerShell $env:OPENAI_API_KEY="sk-xxx"，或 IDE 运行配置的 Environment Variables
      # 未配置时启动即失败（AgentConfig fail-fast），不会拖到首次对话才报错
      api-key: ${OPENAI_API_KEY:}
      # Base URL：默认官方 OpenAI，替换为兼容接口时改这里（非敏感，可保留默认）
      # DeepSeek: https://api.deepseek.com/v1
      # 通义千问兼容: https://dashscope.aliyuncs.com/compatible-mode/v1
      # Ollama: http://localhost:11434/v1
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      # 模型名
      model-name: ${OPENAI_MODEL:deepseek-v4-flash}
      # 备用模型：主模型限流/故障时降级（与主模型共用 api-key/base-url，仅换模型名）
      fallback-model-name: ${OPENAI_FALLBACK_MODEL:deepseek-chat}
      # 生成参数
      temperature: 0.7
      top-p: 0.9
      timeout: 60s
      # 原始 HTTP 请求/响应日志（已用 ReActLoggerListener 打印友好格式，这里关掉避免重复刷屏）
      log-requests: false
      log-responses: false

# ===== RAG 检索增强配置 =====
# 使用本地进程内 Embedding 模型（bge-small-zh-v1.5 量化版，ONNX），无需外部 API Key
rag:
  enabled: true              # 置 false 可完全关闭 RAG（对话不受影响）
  # 向量存储模式：memory=进程内 InMemory + JSON 快照（本地默认）；
  #              pgvector=PostgreSQL+pgvector 外置（生产，内存有界/多实例共享，P1-9.1）
  store: ${RAG_STORE:memory}
  # memory 模式的向量快照文件（相对服务 WorkingDirectory；启动加载、写入后防抖异步落盘）
  store-file: data/rag-embeddings.json
  # ===== pgvector 模式连接配置（仅 store=pgvector 时生效；生产经 systemd 环境变量注入） =====
  pgvector:
    host: ${RAG_PG_HOST:127.0.0.1}
    port: ${RAG_PG_PORT:5432}
    database: ${RAG_PG_DATABASE:agent_rag}
    table: rag_embeddings
    user: ${RAG_PG_USER:agent_rag}
    password: ${RAG_PG_PASSWORD:}   # 缺失时启动 fail-fast（与 API key/DB 密码同约定）
    dimension: 512                  # bge-small-zh-v1.5 向量维度，换模型必须同步改
    # 首次 pgvector 启动时，把旧 JSON 快照一次性迁入 PG（PG 为空才执行，成功后快照归档）
    migrate-snapshot: true
  chunk-size: 500            # 文档切块：每段最大字符数（中文按字符计）
  chunk-overlap: 50          # 相邻块重叠字符数，避免语义被切断
  # ===== 二进制文档解析（Tika，P1-9.2） =====
  parse:
    max-text-chars: 500000   # 抽出正文上限 50 万字，超出判定失败（防解析炸弹）
    timeout-seconds: 60      # 单文档解析墙钟超时，超时中断
    threads: 2               # 解析线程池大小（有界队列 8，满载 503）
  search:
    max-results: 4           # 最终注入上下文的片段数（融合/精排之后）
    min-score: 0.5           # 纯向量模式相似度下限（0~1）
    candidate-min-score: 0.3 # 混合/精排模式向量粗召下限（放宽以扩大候选，再交 RRF/Rerank 精选）
    vector-top-k: 10         # 向量粗召条数
    keyword-top-k: 10        # 关键词粗召条数（仅 pgvector + hybrid=true）
    hybrid: true             # 双路召回（向量+pg_trgm 关键词）；memory 模式自动退化为纯向量
  # ===== Rerank 精排（P1-9.3）：默认休眠，跑 reranker-setup.sh 下模型并置 enabled=true =====
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    model-dir: ${RAG_RERANK_DIR:/opt/agent-data/models/bge-reranker-base}
    model-file: model_quantized.onnx
    tokenizer-file: tokenizer.json

# ===== 日志配置 =====
logging:
  level:
    # 我们自己的代码：INFO 可见（ReAct 日志、工具调用日志）
    com.example.agent: INFO
    # LangChain4j 框架日志：INFO（看不到内部细节，只看我们 listener 打的）
    dev.langchain4j: WARN
    # Spring 框架：WARN，减少启动噪音
    org.springframework: WARN
  pattern:
    # 日志格式：[traceId] 串联 frontend→backend→agent→LLM/工具/RAG 全链路（无 trace 时显示 -）
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
