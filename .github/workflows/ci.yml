name: ci
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 强制 clean：防 IDE 增量编译污染产物的坑（本项目踩过：错误桩进 jar）
      - name: Test
        run: ./mvnw -B clean test